# Render blueprint — ONLY if you host on Render instead of Vercel (not both).
# Render → New → Blueprint → pick this repo. Fill in the secret values when asked.
services:
  - type: web
    name: arise-numero
    runtime: node
    rootDir: webapp
    # "free" sleeps after 15 min idle (first visit then takes ~1 min); use "starter" for a live shop.
    plan: starter
    region: singapore
    buildCommand: npm ci && npx prisma migrate deploy && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL # Neon pooled connection string
        sync: false
      - key: DIRECT_URL # Neon direct connection string
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: NEXT_PUBLIC_SITE_URL # e.g. https://arisenumero.co.in
        sync: false
      - key: ADMIN_LOGIN_EMAIL
        value: arisenumero@gmail.com
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "465"
      - key: SMTP_USER
        value: arisenumero@gmail.com
      - key: SMTP_PASS # Gmail App Password
        sync: false
      - key: ADMIN_NOTIFY_EMAIL
        sync: false
      - key: CASHFREE_MODE
        value: sandbox
      - key: CASHFREE_APP_ID
        sync: false
      - key: CASHFREE_SECRET_KEY
        sync: false
